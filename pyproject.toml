[project]
name = "cycls-studio"
version = "0.1.0"
description = "A Blender-style 3D studio for Cycls agents: build a scene in chat, edit it by hand, render it with real Blender."
readme = "README.md"
requires-python = ">=3.10"
# Needs a cycls with the extension hook (cycls.Extension, Web().use) and the app bridge's
# engine/onCommand/ask — the SDK's feat/extensions branch until it is released.
dependencies = ["cycls"]

[dependency-groups]
test = ["pytest>=8.0.0", "python-multipart>=0.0.6"]

[tool.uv.sources]
cycls = { path = "../cycls-sdk-ext", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cycls_studio"]

[tool.hatch.build.targets.sdist]
include = ["cycls_studio/**/*", "README.md"]
